# อัปเดตข้อมูลหนังใน Firestore ทุกสัปดาห์ (firebase-upload/weekly_update.py)
# ต้องตั้ง Secrets: TMDB_API_KEY, OMDB_API_KEYS, FIREBASE_SERVICE_ACCOUNT และ ALGOLIA_ADMIN_KEY (ดู README)
name: Weekly data update

on:
  schedule:
    - cron: "0 20 * * 0"          # ทุกวันอาทิตย์ 20:00 UTC = วันจันทร์ 03:00 เวลาไทย
  workflow_dispatch:              # ปุ่ม "Run workflow" ในแท็บ Actions
    inputs:
      dry_run:
        description: "Dry run — คำนวณอย่างเดียว ไม่เขียนฐานข้อมูล"
        type: boolean
        default: true
      details_backfill:
        description: "เติม Genres / ชุดภาพยนตร์ / ค่ายผลิตให้เรื่องเก่าไม่เกินกี่เรื่อง (ครั้งแรกใส่ 80000 = ทั้งฐาน)"
        type: string
        default: "20000"
      algolia_rebuild:
        description: "สร้างช่องค้นหา (Algolia) ใหม่ทั้ง index — ใช้เมื่อค้นกลางชื่อไทยไม่เจอ"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: firebase-upload/requirements.txt

      - name: Install dependencies
        run: pip install -r firebase-upload/requirements.txt

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::ยังไม่ได้ตั้ง secret FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Update Firestore
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEYS: ${{ secrets.OMDB_API_KEYS }}
          # งบ OMDb ต่อรอบ: 90% ของ plan Standard (500,000/วัน) — เปลี่ยนได้ที่ Settings → Secrets and variables → Actions → Variables
          OMDB_DAILY_LIMIT: ${{ vars.OMDB_DAILY_LIMIT || '450000' }}
          # Admin API Key ของ Algolia (ใช้ sync ช่องค้นหา) — ถ้าไม่ตั้ง จะข้ามขั้นนี้
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MAX_DETAILS_BACKFILL: ${{ inputs.details_backfill || '20000' }}
          ALGOLIA_FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.algolia_rebuild }}
        run: python firebase-upload/weekly_update.py

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
